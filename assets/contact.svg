<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="286" viewBox="0 0 1200 286" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Have a hard problem? Let’s make it useful.</title>
  <desc id="desc">Contact Saif Shahzad about a project or collaboration at saifshahzad901@gmail.com.</desc>
  <style>
  .pulse { animation: breathe 6s ease-in-out infinite; }
  .flow { stroke-dasharray: 5 16; animation: flow 12s linear infinite; }
  .nudge { animation: nudge 6s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  @keyframes flow { to { stroke-dashoffset: -168; } }
  @keyframes nudge { 0%, 70%, 100% { transform: translate(0,0); } 80% { transform: translate(5px,-5px); } }
  @media (prefers-reduced-motion: reduce) {
    .pulse, .flow, .nudge { animation: none !important; }
    .motion { display: none; }
  }
</style>
  <rect width="1200" height="286" rx="18" fill="#d6ff7f" />
  <text x="52" y="48" fill="#0c1017" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="14" font-weight="400" letter-spacing="1.3">YOUR NEXT PROJECT STARTS WITH A CONVERSATION</text>
  <text x="47" y="127" fill="#0c1017" font-family="Arial,Helvetica,sans-serif" font-size="67" font-weight="700" letter-spacing="-3">Have a hard problem?</text>
  <text x="47" y="204" fill="#0c1017" font-family="Arial,Helvetica,sans-serif" font-size="67" font-weight="700" letter-spacing="-3">Let's make it useful.</text>
  <text x="52" y="252" fill="#0c1017" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="17" font-weight="400" letter-spacing="1">SAIFSHAHZAD901@GMAIL.COM</text>
  <path d="M1005 182 1129 58M1013 58h116v116" stroke="#0c1017" stroke-width="9" stroke-linecap="square" stroke-linejoin="miter" class="nudge" />
</svg>
