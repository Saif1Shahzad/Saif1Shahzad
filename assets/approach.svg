<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="228" viewBox="0 0 1200 228" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Understand → Experiment → Build → Refine</title>
  <desc id="desc">Understand the decision and data. Establish baselines and evaluate honestly. Build an inspectable tool. Refine with feedback.</desc>
  <style>
  .pulse { animation: breathe 6s ease-in-out infinite; }
  .flow { stroke-dasharray: 5 16; animation: flow 12s linear infinite; }
  .nudge { animation: nudge 6s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  @keyframes flow { to { stroke-dashoffset: -168; } }
  @keyframes nudge { 0%, 70%, 100% { transform: translate(0,0); } 80% { transform: translate(5px,-5px); } }
  @media (prefers-reduced-motion: reduce) {
    .pulse, .flow, .nudge { animation: none !important; }
    .motion { display: none; }
  }
</style>
  <rect width="1200" height="228" rx="16" fill="#0c1017" />
  <text x="40" y="40" fill="#a5adbd" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="13" font-weight="400" letter-spacing="1.5">HOW I APPROACH A PROBLEM</text>
  <circle cx="45.00" cy="81.00" r="4.00" fill="#a59aff" />
  <line x1="60" y1="81" x2="310" y2="81" stroke="#293140" stroke-width="1" />
  <text x="40" y="126" fill="#a59aff" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="13" font-weight="400" letter-spacing="0.5">01</text>
  <text x="40" y="163" fill="#f1f0e8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">Understand</text>
  <text x="40" y="196" fill="#a5adbd" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">The decision. The data.</text>
  <circle cx="335.00" cy="81.00" r="4.00" fill="#a59aff" />
  <line x1="350" y1="81" x2="600" y2="81" stroke="#293140" stroke-width="1" />
  <text x="330" y="126" fill="#a59aff" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="13" font-weight="400" letter-spacing="0.5">02</text>
  <text x="330" y="163" fill="#f1f0e8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">Experiment</text>
  <text x="330" y="196" fill="#a5adbd" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Baselines. Honest evaluation.</text>
  <circle cx="625.00" cy="81.00" r="4.00" fill="#a59aff" />
  <line x1="640" y1="81" x2="890" y2="81" stroke="#293140" stroke-width="1" />
  <text x="620" y="126" fill="#a59aff" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="13" font-weight="400" letter-spacing="0.5">03</text>
  <text x="620" y="163" fill="#f1f0e8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">Build</text>
  <text x="620" y="196" fill="#a5adbd" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">A usable, inspectable tool.</text>
  <circle cx="915.00" cy="81.00" r="4.00" fill="#d6ff7f" />
  <line x1="930" y1="81" x2="1160" y2="81" stroke="#293140" stroke-width="1" />
  <text x="910" y="126" fill="#a59aff" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="13" font-weight="400" letter-spacing="0.5">04</text>
  <text x="910" y="163" fill="#f1f0e8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">Refine</text>
  <text x="910" y="196" fill="#a5adbd" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Feedback. Better decisions.</text>
  <g class="motion">
    <circle r="3" fill="#d6ff7f">
      <animateMotion dur="15s" repeatCount="indefinite" path="M45 81 H915" calcMode="paced" />
    </circle>
  </g>
</svg>
